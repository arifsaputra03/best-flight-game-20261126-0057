<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour — a sunset flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Golden Hour: fly the Kestrel KH-1 from Gullwing Bay, through six gold rings, and land before the fuel runs out"></canvas>
<canvas id="hud"></canvas>
<p id="status" role="status" aria-live="polite">Golden Hour. Press Enter to fly.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
